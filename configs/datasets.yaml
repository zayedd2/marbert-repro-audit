# Published targets: [1], Tables 3 and 4. Paper sizes: [1], Table A.1 (no dev split for any of the three).
arsarcasm:
  display_name: ArSarcasm-Sent
  short_name: ArSarc
  labels: [negative, neutral, positive]
  positive_label: positive
  negative_label: negative
  historical_metric: f1_pn          # mean of positive and negative F1 on the full 3-class test set
  published: {marbert: 71.50, arabert: 63.50}
  paper_sizes: {train: 8437, test: 2110}
  our_sizes: {train_full: 8437, train: 7593, dev: 844, test: 2110}
  subgroup_columns: [dialect, sarcasm]

astd:
  display_name: ASTD
  short_name: ASTD
  labels: [negative, neutral, positive]
  positive_label: positive
  negative_label: negative
  historical_metric: f1_pn
  published: {marbert: 78.00, arabert: 72.00}
  paper_sizes: {train: 24800, test: 664}
  our_sizes: {train_full: 27394, train: 24654, dev: 2740, test: 661}
  subgroup_columns: []
  note: Trained on CAMelSent rebuilt from ArSAS, ASTD, SemEval-2017 and ArSenTD-LEV (scripts/build_camelsent.py); tested on the official ASTD test split, objective tweets dropped.

ajgt:
  display_name: AJGT
  short_name: AJGT
  labels: [negative, positive]
  positive_label: positive
  negative_label: negative
  historical_metric: accuracy
  published: {marbert: 96.11, arabert: 92.22}
  paper_sizes: {train: 1440, test: 361}
  our_sizes: {train_full: 1440, train: 1296, dev: 144, test: 360}
  subgroup_columns: []
  note: Our stratified 80/20 split (seed 42). [1]'s "361" is the line count of the authors' test file (header + 360).

# Check runs only (historical protocol): AJGT on the authors' own split from github.com/UBC-NLP/marbert (examples/).
ajgt_ubc:
  display_name: AJGT (authors' split)
  short_name: AJGT-UBC
  labels: [negative, positive]
  positive_label: positive
  negative_label: negative
  historical_metric: accuracy
  published: {marbert: 96.11, arabert: 92.22}
  paper_sizes: {train: 1440, test: 361}
  our_sizes: {train_full: 1440, test: 360}
  subgroup_columns: []
  check_only: true
