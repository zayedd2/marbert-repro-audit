# Settings of the runs that produced the reported results (Members 2 and 3, Colab, November 2026).
# Training happened in notebooks/historical_reproduction.ipynb; the values below document those runs and
# drive the analysis code. Every difference from [1] is logged in docs/DEPARTURES.md.
# [1] Abdul-Mageed, Elmadany & Nagoudi (2021), ARBERT & MARBERT, ACL-IJCNLP.

experiment_name: marbert-repro-audit

seeds: [42, 43, 44]          # one seed per run; MARBERT and AraBERT share seeds, code, data and GPU

dev_fraction: 0.10           # Member 1: stratified, grouped (copies of a tweet stay together), seed 42

training:                    # as run (notebook section 2); [1] Sec. 3.4 unless marked
  optimizer: adam            # torch.optim.Adam, no weight decay
  learning_rate: 2.0e-6
  weight_decay: 0.0
  batch_size: 32
  max_length: 256            # dynamic padding per batch (ours)
  epochs: 25
  lr_schedule: constant      # unreported in [1]; assumption (departure 4)
  warmup_steps: 0
  fp16: true                 # mixed precision (departure 7)
  dropout: 0.1               # HF default classification head (departure 6)
  eval_batch_size: 128

preprocessing:               # applied identically to both models (departure 9)
  replace_mentions: "USER"
  replace_urls: "URL"
  normalize_whitespace: true
  remove_diacritics: false   # [1] removes them; found after the runs
  replace_hashtags: false    # [1] replaces them with HASHTAG; found after the runs

selection:
  tie_break: earliest        # if two epochs tie on the selection metric, take the earlier one

bootstrap:                   # identical to the team's notebook (section 19), so CIs regenerate exactly
  n_resamples: 1000
  confidence: 0.95
  seed: 12345                # one generator, drawn per (protocol, dataset) in table order

reproduction:
  gap_threshold_pp: 2.0      # reproduced if |gap| <= 2 pp or published score inside our seed range,
                             # AND MARBERT > AraBERT on that dataset (fixed in the proposal)

subgroups:
  min_group_size: 100        # groups smaller than this are marked exploratory (Member 1's rule)
