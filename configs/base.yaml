# Shared settings for every run. Anything that departs from [1] is listed in docs/DEPARTURES.md.
# [1] Abdul-Mageed, Elmadany & Nagoudi (2021), ARBERT & MARBERT, ACL-IJCNLP.

experiment_name: marbert-repro-audit

# Three training seeds per configuration (proposal, audit item 4).
# A seed controls classifier-head initialisation, dropout and the order of training batches.
seeds: [42, 1234, 2026]

# The dev split is drawn ONCE with its own seed and reused by every model and every training seed,
# so seed-to-seed variation reflects training randomness only, not a different dev set.
split_seed: 20261113
dev_fraction: 0.10          # stratified 10% of each training set (independent protocol only)

training:                   # as in [1] unless marked
  optimizer: adam           # torch.optim.Adam, no weight decay
  learning_rate: 2.0e-6
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]  # PyTorch defaults (unreported in [1])
  adam_eps: 1.0e-8          # PyTorch default (unreported in [1])
  batch_size: 32
  max_length: 256           # truncation length; batches are padded only to their longest item
  epochs: 25
  lr_schedule: constant     # unreported in [1]; logged assumption
  warmup_steps: 0           # unreported in [1]; logged assumption
  max_grad_norm: null       # no clipping (unreported in [1]); set a number to enable
  fp16: false               # mixed precision OFF by default; turning it on is a departure
  eval_batch_size: 128
  deterministic: true       # cuDNN deterministic mode; some GPU kernels may still be nondeterministic

selection:
  tie_break: earliest       # if two epochs tie on the selection metric, take the earlier one

bootstrap:
  n_resamples: 10000        # paired bootstrap over test items
  confidence: 0.95
  seed: 12345
  chunk_size: 500

reproduction:
  gap_threshold_pp: 2.0     # "reproduced" if |gap| <= 2 pp or published score inside our seed range,
                            # AND the MARBERT > AraBERT ranking holds on that dataset

preprocessing:              # scripted and applied identically to both models (unreported in [1])
  normalize_whitespace: true
  replace_urls: "URL"       # set to null to keep URLs as they are
  replace_mentions: "USER"  # set to null to keep @mentions as they are
  remove_diacritics: false
  remove_tatweel: false

subgroups:
  min_group_size: 50        # groups smaller than this are flagged as exploratory in tables
