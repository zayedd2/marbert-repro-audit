historical:
  display_name: Historical
  description: >
    Audit item 1 (Member 2). The paper's protocol: train on the full training set, score the test set after
    every epoch, report the best test epoch under the published metric.
  use_dev_split: false
  selection: {split: test, metric: historical}

independent:
  display_name: Independent
  description: >
    Audit items 2-5 (Member 3), main result. Train on 90% of the training set, choose the epoch with the best
    DEV score under the published metric (F1-PN; accuracy for AJGT), report the test score at that epoch.
    The proposal said dev macro-F1; re-selecting on dev macro-F1 changes test scores by at most 0.4 points
    (see results/tables/selection_rule_check.csv).
  use_dev_split: true
  selection: {split: dev, metric: historical}
  robustness_selection: {split: dev, metric: macro_f1}
